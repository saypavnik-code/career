name: Deploy Escada to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: escada-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checked-out revision
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          echo "Deploying commit ${{ github.sha }}"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install exact dependencies
        run: npm ci

      - name: Remove stale build output
        run: rm -rf .next out

      - name: Run Escada tests
        run: npm run test:escada

      - name: Build current main as static export
        env:
          GITHUB_ACTIONS: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_PUBLIC_ESCADA_AI_ENDPOINT: ${{ vars.ESCADA_AI_ENDPOINT }}
        run: npm run build

      - name: Stamp deployed commit
        run: |
          test -f out/index.html
          printf '%s\n' "${{ github.sha }}" > out/deploy-version.txt
          touch out/.nojekyll

      - name: Upload current build only
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact uploaded artifact
        id: deployment
        uses: actions/deploy-pages@v4
